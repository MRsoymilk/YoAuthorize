name: yoauthorize

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: yoauthorize
      POSTGRES_USER: yoauthorize
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yoauthorize -d yoauthorize"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      dev-net:
        aliases: [yoauthorize-mailpit]
    restart: unless-stopped

  signer:
    image: yoauthorize-signer:local
    user: "${LOCAL_UID:-65532}:${LOCAL_GID:-65532}"
    build:
      context: ${YOAUTHORIZE_REMOTE_DIR:-..}/backend
      dockerfile: Dockerfile.signer
      network: ${DOCKER_BUILD_NETWORK:-default}
    environment:
      SIGNER_LISTEN_ADDR: 0.0.0.0:8090
      SIGNING_KEY_ID: ${SIGNING_KEY_ID:-development-1}
      SIGNING_KEY_FILE: /run/secrets/license_signing_key
      SIGNER_SHARED_SECRET_FILE: /run/secrets/signer_shared_secret
    secrets:
      - license_signing_key
      - signer_shared_secret
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "/usr/local/bin/license-signer", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [signing]
    restart: unless-stopped

  migrate:
    image: yoauthorize-api:local
    build:
      context: ${YOAUTHORIZE_REMOTE_DIR:-..}/backend
      dockerfile: Dockerfile.api
      network: ${DOCKER_BUILD_NETWORK:-default}
    entrypoint: ["migrate"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - database_url
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]
    restart: "no"

  api:
    image: yoauthorize-api:local
    build:
      context: ${YOAUTHORIZE_REMOTE_DIR:-..}/backend
      dockerfile: Dockerfile.api
      network: ${DOCKER_BUILD_NETWORK:-default}
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL: redis://redis:6379/
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8088}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ACTIVATION_PEPPER_FILE: /run/secrets/activation_pepper
      SIGNER_URL: http://signer:8090
      SIGNER_SHARED_SECRET_FILE: /run/secrets/signer_shared_secret
      SMTP_URL: ${SMTP_URL:-smtp://yoauthorize-mailpit:1025}
      MAIL_FROM: ${MAIL_FROM:-YoAuthorize <no-reply@localhost>}
      NO_PROXY: localhost,127.0.0.1,postgres,redis,signer,yoauthorize-mailpit
      no_proxy: localhost,127.0.0.1,postgres,redis,signer,yoauthorize-mailpit
    secrets:
      - database_url
      - activation_pepper
      - signer_shared_secret
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      signer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/authorization-api", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      dev-net:
        aliases: [yoauthorize-api]
      data:
      signing:
    restart: unless-stopped

  web:
    image: yoauthorize-web:local
    build:
      context: ${YOAUTHORIZE_REMOTE_DIR:-..}/frontend
      dockerfile: Dockerfile
      network: ${DOCKER_BUILD_NETWORK:-default}
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      dev-net:
        aliases: [yoauthorize-web]
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8088}
      NO_PROXY: localhost,127.0.0.1,yoauthorize-api,yoauthorize-web
      no_proxy: localhost,127.0.0.1,yoauthorize-api,yoauthorize-web
    ports:
      - "127.0.0.1:${YOAUTHORIZE_HTTP_PORT:-8088}:8088"
    volumes:
      - ${YOAUTHORIZE_REMOTE_DIR:-..}/deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      dev-net:
        aliases: [yoauthorize-caddy]
    restart: unless-stopped

  bootstrap-admin:
    image: yoauthorize-api:local
    profiles: [tools]
    build:
      context: ${YOAUTHORIZE_REMOTE_DIR:-..}/backend
      dockerfile: Dockerfile.api
      network: ${DOCKER_BUILD_NETWORK:-default}
    entrypoint: ["bootstrap-admin"]
    user: "${LOCAL_UID:-65532}:${LOCAL_GID:-65532}"
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrator}
      BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
    secrets:
      - database_url
      - bootstrap_admin_password
    networks: [data]

secrets:
  postgres_password:
    file: ${YOAUTHORIZE_REMOTE_DIR:-..}/deploy/secrets/postgres-password
  database_url:
    file: ${YOAUTHORIZE_REMOTE_DIR:-..}/deploy/secrets/database-url
  activation_pepper:
    file: ${YOAUTHORIZE_REMOTE_DIR:-..}/deploy/secrets/activation-pepper
  signer_shared_secret:
    file: ${YOAUTHORIZE_REMOTE_DIR:-..}/deploy/secrets/signer-shared-secret
  license_signing_key:
    file: ${YOAUTHORIZE_REMOTE_DIR:-..}/deploy/secrets/license-signing-key
  bootstrap_admin_password:
    file: ${YOAUTHORIZE_REMOTE_DIR:-..}/deploy/secrets/bootstrap-admin-password

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  dev-net:
    external: true
    name: dev-net
  data:
    internal: true
  signing:
    internal: true
