[package]
name = "authorization-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "authorization-api"
path = "src/main.rs"

[[bin]]
name = "bootstrap-admin"
path = "src/bootstrap_admin.rs"

[[bin]]
name = "migrate"
path = "src/migrate.rs"

[dependencies]
anyhow.workspace = true
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64.workspace = true
chrono.workspace = true
ed25519-dalek = "2"
hex.workspace = true
hmac = "0.12"
http = "1"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
license-format = { path = "../license-format" }
rand.workspace = true
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
subtle = "2"
thiserror.workspace = true
tokio.workspace = true
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "limit"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
uuid.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
