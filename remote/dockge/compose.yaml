name: dockge

services:
  dockge:
    image: louislam/dockge:1
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      DOCKGE_STACKS_DIR: ${DOCKGE_ROOT:?Run start.sh}/dockge/.state/stacks
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockge_data:/app/data
      - ${DOCKGE_ROOT:?Run start.sh}:${DOCKGE_ROOT:?Run start.sh}
      - ${DOCKGE_DOCKER_CONFIG:?Run start.sh}:/root/.docker:ro
    networks: [dev-net]

volumes:
  dockge_data:

networks:
  dev-net:
    external: true
    name: dev-net
